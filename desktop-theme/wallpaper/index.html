<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis wallpaper</title>
<!--
  A dim Jarvis desktop background for Plash: a faint grid and sparse drifting
  particles. The Jarvis app window is the focal point, so there is no reactor
  here.
  Colours from ~/jarvis-home/src/index.css: cyan #00e5ff on #01060c.

  Kept cheap on purpose:
    - the grid and vignette are drawn once, onto their own canvas;
    - only ~40 particles animate, at 12 frames a second;
    - nothing runs while the page is hidden, or with "reduce motion" on;
    - Plash's "Deactivate while on battery" stops it entirely on battery.
  Tunables are in CONFIG below.
-->
<style>
  html, body { margin: 0; height: 100%; background: #01060c; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="static"></canvas>
<canvas id="live"></canvas>
<script>
const CONFIG = {
  fps: 12,                 // animation frame rate
  cyan: [0, 229, 255],     // --interface
  bg: '#01060c',           // --bg
  gridStep: 64,            // px between grid lines
  particles: 40,
  brightness: 0.55,        // overall dimmer, 0..1
}

const rgba = (a) => `rgba(${CONFIG.cyan.join(',')},${(a * CONFIG.brightness).toFixed(3)})`
const S = document.getElementById('static'), L = document.getElementById('live')
const sctx = S.getContext('2d'), lctx = L.getContext('2d')
let W = 0, H = 0, particles = []

function size() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5)   // cap: fewer pixels, less GPU
  W = innerWidth; H = innerHeight
  for (const c of [S, L]) { c.width = W * dpr; c.height = H * dpr }
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0); lctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  drawStatic()
  particles = Array.from({ length: CONFIG.particles }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,   // px per second
    r: 0.6 + Math.random() * 1.2, phase: Math.random() * Math.PI * 2,
  }))
}

function drawStatic() {
  sctx.fillStyle = CONFIG.bg; sctx.fillRect(0, 0, W, H)
  // faint grid
  sctx.strokeStyle = rgba(0.045); sctx.lineWidth = 1; sctx.beginPath()
  for (let x = 0.5; x < W; x += CONFIG.gridStep) { sctx.moveTo(x, 0); sctx.lineTo(x, H) }
  for (let y = 0.5; y < H; y += CONFIG.gridStep) { sctx.moveTo(0, y); sctx.lineTo(W, y) }
  sctx.stroke()
  // vignette
  const v = sctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75)
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)')
  sctx.fillStyle = v; sctx.fillRect(0, 0, W, H)
}

function frame(t) {
  const s = t / 1000
  lctx.clearRect(0, 0, W, H)
  // sparse particles
  for (const p of particles) {
    p.x = (p.x + p.vx / CONFIG.fps + W) % W; p.y = (p.y + p.vy / CONFIG.fps + H) % H
    lctx.fillStyle = rgba(0.25 + 0.2 * Math.sin(s * 0.8 + p.phase))
    lctx.beginPath(); lctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); lctx.fill()
  }
}

let timer = null
const reduced = matchMedia('(prefers-reduced-motion: reduce)')
function start() {
  stop()
  frame(performance.now())                       // always paint one frame
  if (document.hidden || reduced.matches) return // then stay still
  timer = setInterval(() => frame(performance.now()), 1000 / CONFIG.fps)
}
function stop() { if (timer) clearInterval(timer); timer = null }

addEventListener('resize', () => { size(); start() })
document.addEventListener('visibilitychange', start)
reduced.addEventListener('change', start)
size(); start()
</script>
</body>
</html>
